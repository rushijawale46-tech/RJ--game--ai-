<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="RJ Game India - Cricket Game">
  <title>RJ Game India</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #05070b;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .loading {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #263c55 0%, #0d1725 35%, #05070b 75%);
      position: relative;
      text-align: center;
    }

    .stadium {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, transparent 48%, rgba(0,0,0,.85)),
        radial-gradient(ellipse at 50% 100%, #27452b 0%, #102015 35%, transparent 65%);
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(92vw, 900px);
    }

    .logo {
      font-size: clamp(38px, 9vw, 82px);
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(255,255,255,.35);
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(14px, 3vw, 24px);
      letter-spacing: 5px;
      opacity: .85;
    }

    .players {
      margin: 55px auto 35px;
      height: 190px;
      max-width: 700px;
      position: relative;
    }

    .player {
      position: absolute;
      bottom: 0;
      width: 90px;
      height: 170px;
      border-radius: 45px 45px 20px 20px;
      background: linear-gradient(#d8d8d8 0 38%, #26384c 38% 100%);
      box-shadow: 0 10px 35px rgba(0,0,0,.6);
    }

    .player::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #b9825e;
      top: -25px;
      left: 19px;
    }

    .p1 { left: 8%; transform: rotate(-8deg); }
    .p2 { left: 42%; transform: scale(1.08); }
    .p3 { right: 8%; transform: rotate(8deg); }

    .loading-text {
      font-size: 16px;
      margin-bottom: 12px;
      opacity: .9;
    }

    .bar {
      width: min(80vw, 650px);
      height: 9px;
      margin: auto;
      background: rgba(255,255,255,.18);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 76%;
      height: 100%;
      background: white;
      border-radius: 20px;
      animation: load 2.5s ease-in-out infinite alternate;
    }

    @keyframes load {
      from { width: 68%; }
      to { width: 86%; }
    }

    .version {
      margin-top: 18px;
      font-size: 13px;
      opacity: .65;
    }

    .features {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .feature {
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      background: rgba(0,0,0,.3);
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="loading">
    <div class="stadium"></div>

    <section class="content">
      <div class="logo">RJ GAME INDIA</div>
      <div class="subtitle">CRICKET • 3D • INDIA</div>

      <div class="players">
        <div class="player p1"></div>
        <div class="player p2"></div>
        <div class="player p3"></div>
      </div>

      <div class="loading-text">LOADING RJ GAME INDIA...</div>

      <div class="bar">
        <div class="progress"></div>
      </div>

      <div class="features">
        <span class="feature">PLAYING XI</span>
        <span class="feature">IPL AUCTION</span>
        <span class="feature">CAREER MODE</span>
        <span class="feature">REPLAY</span>
        <span class="feature">MULTI CAMERA</span>
        <span class="feature">WEATHER</span>
      </div>

      <div class="version">Version 1.0.0 • Made for Cricket Fans ❤️</div>
    </section>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(error => console.log("Service Worker:", error));
    }
  </script>

</body>
                                           </html>
